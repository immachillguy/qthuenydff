<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chấm Điểm Phát Âm Tiếng Trung Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #1f2937;
            --light: #f9fafb;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #e0e7ff 0%, #eef2ff 100%);
            color: var(--dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 550px;
            width: 100%;
            transition: all 0.3s ease;
        }

        h2 {
            font-size: 1.5rem;
            color: #4b5563;
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: 600;
        }

        /* Vùng hiển thị tiếng Trung */
        .display-box {
            background-color: var(--light);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 30px;
            border: 1px solid #e5e7eb;
        }

        .chinese-text {
            font-size: 42px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .pinyin {
            font-size: 20px;
            color: #6b7280;
            font-style: italic;
            margin-bottom: 5px;
        }

        .translation {
            font-size: 15px;
            color: #9ca3af;
        }

        /* Nút điều khiển câu và âm thanh */
        .action-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 35px;
        }

        .btn-secondary {
            background-color: white;
            border: 1px solid #d1d5db;
            color: #374151;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background-color: #f3f4f6;
            border-color: #9ca3af;
        }

        /* Nút ghi âm chính */
        .record-zone {
            margin-bottom: 30px;
        }

        .btn-main {
            background-color: var(--primary);
            color: white;
            border: none;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .btn-main:hover {
            transform: scale(1.05);
            background-color: var(--primary-hover);
        }

        .btn-main.recording {
            background-color: var(--danger);
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        #status {
            font-size: 14px;
            font-weight: 500;
            color: #6b7280;
            margin-top: 10px;
        }

        /* Vùng kết quả dạng vòng tròn và chi tiết */
        .result-box {
            margin-top: 25px;
            padding: 25px;
            border-radius: 16px;
            background: var(--light);
            border: 1px solid #e5e7eb;
            display: none;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-around;
            margin-bottom: 20px;
        }

        .score-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 6px solid var(--success);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .score-num { font-size: 24px; }
        .score-label { font-size: 10px; text-transform: uppercase; color: #6b7280; }

        .transcript-zone {
            text-align: left;
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #f3f4f6;
        }

        .transcript-title {
            font-size: 12px;
            font-weight: 600;
            color: #9ca3af;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Ứng Dụng Luyện Phát Âm Tiếng Trung</h2>
    
    <div class="display-box">
        <div class="chinese-text" id="targetText">你好</div>
        <div class="pinyin" id="targetPinyin">Nǐ hǎo</div>
        <div class="translation" id="targetTranslation">Xin chào</div>
    </div>

    <div class="action-bar">
        <button class="btn-secondary" id="speakBtn"><i class="fas fa-volume-up"></i> Nghe mẫu</button>
        <button class="btn-secondary" id="nextBtn"><i class="fas fa-random"></i> Đổi câu khác</button>
    </div>

    <div class="record-zone">
        <button class="btn-main" id="recordBtn"><i class="fas fa-microphone" id="micIcon"></i></button>
        <div id="status">Nhấn micro để bắt đầu nói</div>
    </div>

    <div class="result-box" id="resultBox">
        <div class="result-header">
            <div style="text-align: left;">
                <h4 style="margin: 0 0 5px 0; color: #374151;">Kết quả phân tích</h4>
                <span id="feedbackMsg" style="font-weight: 600;">Làm tốt lắm!</span>
            </div>
            <div class="score-circle" id="scoreBorder">
                <span class="score-num" id="scorePercent">0%</span>
                <span class="score-label">Chính xác</span>
            </div>
        </div>
        <div class="transcript-zone">
            <div class="transcript-title">Máy nghe được:</div>
            <div id="recognizedText" style="font-size: 18px; font-weight: 500; color: var(--dark);">-</div>
        </div>
    </div>
</div>

<script>
    // THAY API KEY CỦA BẠN VÀO ĐÂY
    const GOOGLE_API_KEY = "AIzaSyA_aer1hVXkMPWNYhPnEC1TmWjzUBf5ue0"; 

    // Ngân hàng câu hỏi mẫu (Bạn có thể thêm tùy thích)
    const sentenceBank = [
        { zh: "你好", py: "Nǐ hǎo", vi: "Xin chào" },
        { zh: "谢谢你", py: "Xièxie nǐ", vi: "Cảm ơn bạn" },
        { zh: "不客气", py: "Bú kèqì", vi: "Không có gì/Đừng khách sáo" },
        { zh: "我爱你", py: "Wǒ ài nǐ", vi: "Tôi yêu bạn" },
        { zh: "今天天气很好", py: "Jīntiān tiānqì hěn hǎo", vi: "Hôm nay thời tiết rất đẹp" },
        { zh: "你想吃什么？", py: "Nǐ xiǎng chī shénme?", vi: "Bạn muốn ăn gì?" },
        { zh: "汉语不太难", py: "Hànyǔ bú tài nán", vi: "Tiếng Trung không khó lắm" }
    ];

    let currentSentence = sentenceBank[0];
    let mediaRecorder;
    let audioChunks = [];
    let audioContext;

    const recordBtn = document.getElementById('recordBtn');
    const micIcon = document.getElementById('micIcon');
    const statusDiv = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');
    const recognizedText = document.getElementById('recognizedText');
    const scorePercent = document.getElementById('scorePercent');
    const scoreBorder = document.getElementById('scoreBorder');
    const feedbackMsg = document.getElementById('feedbackMsg');

    // 1. Đổi câu ngẫu nhiên
    document.getElementById('nextBtn').addEventListener('click', () => {
        let nextSentence;
        do {
            nextSentence = sentenceBank[Math.floor(Math.random() * sentenceBank.length)];
        } while (nextSentence.zh === currentSentence.zh && sentenceBank.length > 1);
        
        currentSentence = nextSentence;
        document.getElementById('targetText').innerText = currentSentence.zh;
        document.getElementById('targetPinyin').innerText = currentSentence.py;
        document.getElementById('targetTranslation').innerText = currentSentence.vi;
        
        // Ẩn kết quả cũ
        resultBox.style.display = "none";
        statusDiv.innerText = "Nhấn micro để bắt đầu nói";
    });

    // 2. Phát âm mẫu bằng Web Speech API của trình duyệt
    document.getElementById('speakBtn').addEventListener('click', () => {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(currentSentence.zh);
            utterance.lang = 'zh-CN'; // Chuyển giọng chuẩn Trung Quốc
            utterance.rate = 0.8;    // Nói chậm một chút để dễ nghe mẫu
            window.speechSynthesis.speak(utterance);
        } else {
            alert("Trình duyệt của bạn không hỗ trợ phát âm mẫu.");
        }
    });

    // 3. Logic xử lý Ghi âm
    recordBtn.addEventListener('click', async () => {
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
            return;
        }

        audioChunks = [];
        statusDiv.innerText = "Đang nghe... Nói ngay đi!";
        micIcon.className = "fas fa-stop";
        recordBtn.classList.add('recording');
        resultBox.style.display = "none";

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            mediaRecorder = new MediaRecorder(stream);
            
            mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
            mediaRecorder.onstop = async () => {
                micIcon.className = "fas fa-microphone";
                recordBtn.classList.remove('recording');
                statusDiv.innerText = "Đang mã hóa âm thanh...";

                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.readAsDataURL(audioBlob);
                reader.onloadend = async () => {
                    const base64Audio = reader.result.split(',')[1];
                    sendToGoogleSpeech(base64Audio);
                };
            };
            mediaRecorder.start();
        } catch (err) {
            statusDiv.innerText = "Không thể truy cập Microphone!";
            console.error(err);
        }
    });

    // 4. Gửi dữ liệu tới Google Cloud Speech-to-Text
    async function sendToGoogleSpeech(base64Audio) {
        statusDiv.innerText = "Đang phân tích giọng nói...";
        const url = `https://speech.googleapis.com/v1/speech:recognize?key=${GOOGLE_API_KEY}`;
        const requestBody = {
            config: {
                encoding: "WEBM_OPUS",
                sampleRateHertz: 16000,
                languageCode: "cmn-Hans-CN"
            },
            audio: { content: base64Audio }
        };

        try {
            const response = await fetch(url, {
                method: "POST",
                body: JSON.stringify(requestBody),
                headers: { "Content-Type": "application/json" }
            });
            const data = await response.json();
            
            if (data.results && data.results.length > 0) {
                const transcript = data.results[0].alternatives[0].transcript.trim();
                calculateScore(transcript);
            } else {
                statusDiv.innerText = "Thử lại";
                alert("Máy không nghe rõ bạn nói gì, bạn hãy thử lại nhé!");
            }
        } catch (error) {
            console.error(error);
            statusDiv.innerText = "Lỗi kết nối API.";
        }
    }

    // 5. Chấm điểm % và Phản hồi giao diện trực quan
    function calculateScore(transcript) {
        statusDiv.innerText = "Hoàn thành!";
        resultBox.style.display = "block";
        recognizedText.innerText = transcript;

        // Xử lý chuỗi loại bỏ dấu câu để so sánh chính xác hơn
        const cleanTarget = currentSentence.zh.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?？。，！]/g,"");
        const cleanTranscript = transcript.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?？。，！]/g,"");

        let matchCount = 0;
        for (let char of cleanTarget) {
            if (cleanTranscript.includes(char)) {
                matchCount++;
            }
        }

        const score = Math.round((matchCount / cleanTarget.length) * 100);
        scorePercent.innerText = `${score}%`;
        
        // Phản hồi dựa trên mức độ % chính xác
        if(score >= 80) {
            scoreBorder.style.borderColor = "var(--success)";
            feedbackMsg.innerText = "Tuyệt vời! Phát âm rất chuẩn.";
            feedbackMsg.style.color = "var(--success)";
        } else if(score >= 50) {
            scoreBorder.style.borderColor = "var(--warning)";
            feedbackMsg.innerText = "Khá tốt! Cần chú ý thêm thanh điệu.";
            feedbackMsg.style.color = "var(--warning)";
        } else {
            scoreBorder.style.borderColor = "var(--danger)";
            feedbackMsg.innerText = "Chưa chính xác lắm. Hãy nghe lại mẫu nhé!";
            feedbackMsg.style.color = "var(--danger)";
        }
    }
</script>

</body>
<H1>Lê Đặng Quốc Thiện - ĐHSANH25A</H1>
</html>
